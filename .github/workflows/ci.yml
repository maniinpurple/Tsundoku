name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run lint
      - run: npm run build:chrome
      - run: npm run zip
      - run: npm run zip:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-firefox
          path: dist/*-firefox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-chrome
          path: dist/*-chrome.zip
