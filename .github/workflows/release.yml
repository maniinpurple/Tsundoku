name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) to publish a release:
# the Firefox build is signed by Mozilla (unlisted), both builds are attached to a GitHub release,
# and updates.json is updated so installed Firefox copies update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm run check
      - run: npm run build
      - run: npm run lint
      - run: npm run zip:chrome

      - name: Sign the Firefox build
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets first"
            exit 1
          fi
          npx web-ext sign --channel unlisted -s dist/firefox-mv3 --artifacts-dir web-ext-artifacts
          mv web-ext-artifacts/*.xpi "tsundoku-$VERSION-firefox.xpi"
          cp "dist/tsundoku-$VERSION-chrome.zip" .

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "tsundoku-$VERSION-firefox.xpi" "tsundoku-$VERSION-chrome.zip" \
            --title "Tsundoku $VERSION" --generate-notes

      - name: Tell installed Firefox copies about the new version
        run: |
          HASH=$(sha256sum "tsundoku-$VERSION-firefox.xpi" | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/tsundoku-$VERSION-firefox.xpi"
          git fetch origin main
          git checkout main
          node scripts/add-firefox-update.mjs "$VERSION" "$URL" "sha256:$HASH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "chore: Firefox update manifest for $VERSION [skip ci]"
          git pull --rebase origin main
          git push origin main
